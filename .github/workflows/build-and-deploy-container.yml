name: Build and Deploy Container 📦

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: krono-api

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag variables
        id: tag_vars
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # This is a Go project (no package.json). Derive a semver version from
          # version tags (e.g. v1.2.3 -> 1.2.3). Branch builds only get branch
          # and branch-<sha> tags (plus `latest` on the default branch).
          VERSION=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v*.*.* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -n "$VERSION" ]; then
            MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
            MAJOR="$(echo "$VERSION" | cut -d. -f1)"

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
            echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}
          # ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag_vars.outputs.branch }}
            type=raw,value=${{ steps.tag_vars.outputs.branch }}-${{ steps.tag_vars.outputs.short_sha }}
            type=raw,value=${{ steps.tag_vars.outputs.version }},enable=${{ steps.tag_vars.outputs.version != '' }}
            type=raw,value=${{ steps.tag_vars.outputs.major_minor }},enable=${{ steps.tag_vars.outputs.major_minor != '' }}
            type=raw,value=${{ steps.tag_vars.outputs.major }},enable=${{ steps.tag_vars.outputs.major != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.build.outputs.digest }}

      - name: Send Discord Notification on PR
        uses: rjstone/discord-webhook-notify@v2
        if: github.event_name == 'pull_request'
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: 'Krono CI/CD Bot'
          severity: info
          title: 'ℹ️ Docker Image Build for Pull Request'
          description: |
            **Repository:** ${{ github.repository }}
            **Pull Request:** #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Status:** ${{ github.event.pull_request.state }}

      - name: Send Discord Notification on Success
        uses: rjstone/discord-webhook-notify@v2
        if: success() && github.event_name != 'pull_request'
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: 'Krono CI/CD Bot'
          severity: info
          title: '✅ Successfully Built and Published Docker Image'
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}

            **Image Details:**
            🐳 **GHCR:** `ghcr.io/${{ github.repository }}`

            **Tags Published:**
            ${{ steps.meta.outputs.tags }}

            **Workflow Run:** [View on GitHub](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Send Discord Notification on Failure
        uses: rjstone/discord-webhook-notify@v2
        if: failure() && github.event_name != 'pull_request'
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: 'Krono CI/CD Bot'
          severity: error
          title: '❌ Failed to Build or Publish Docker Image'
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}

            ⚠️ **The Docker image build failed.**

            **Possible Causes:**
            • Dockerfile syntax error
            • go mod download / go build failed
            • Missing environment variables
            • MongoDB connection failure
            • Platform-specific compilation issue

            **Action Required:**
            Check the [detailed logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to diagnose the issue.
